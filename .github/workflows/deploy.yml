name: Catálogo Fácil - Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Catálogo Fácil
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Compilar aplicación
        run: npm run build

      - name: Incluir catálogos publicados
        run: |
          if [ -d catalogs ]; then
            mkdir -p dist/catalogs
            cp -R catalogs/. dist/catalogs/
          fi

      - name: Verificar compilación
        run: test -s dist/index.html

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: Publicar Catálogo Fácil
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
